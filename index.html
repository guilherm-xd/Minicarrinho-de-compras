<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Minicarrinho de Compras</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        .produtos {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .card {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            flex: 1;
        }

        .card button {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .card button:hover {
            background: #218838;
        }

        .carrinho-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #eee;
        }

        .total-box {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            text-align: right;
        }

        #botaoEsvaziar {
            background: #d31f1f;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        #botaoEsvaziar:hover {
            background: #c4110b;
        }
    </style>
</head>

<body>

    <h2>🍇 Feirinha de Frutas</h2>

    <div class="produtos">
        <div class="card">
            <h3>🍎 Maçã</h3>
            <p>R$ 3,50</p>
            <button class="btn-add" data-nome="Maçã" data-preco="3.50">Adicionar</button>
        </div>
        <div class="card">
            <h3>🍌 Banana</h3>
            <p>R$ 2,00</p>
            <button class="btn-add" data-nome="Banana" data-preco="2.00">Adicionar</button>
        </div>
        <div class="card">
            <h3>🥑 Abacate</h3>
            <p>R$ 6,00</p>
            <button class="btn-add" data-nome="Abacate" data-preco="6.00">Adicionar</button>
        </div>
    </div>

    <div class="carrinho-box">
        <h3>🛒 Seu Carrinho</h3>
        <button type="button" id="botaoEsvaziar">Esvaziar carrinho</button>
        <ul id="lista-carrinho">
            <!-- Os itens do carrinho vão entrar aqui via JS -->
        </ul>
        <div class="total-box">
            Total: R$ <span id="valor-total">0.00</span>
        </div>
    </div>

    <script>
        const botoes = document.querySelectorAll('.btn-add');
        const listaCarrinho = document.querySelector('#lista-carrinho');
        const valorTotalEl = document.querySelector('#valor-total');
        const botaoEsvaziar = document.getElementById("botaoEsvaziar");

        let quantidades = {};
        let itens = {};
        let total = 0;

        botoes.forEach(botao => {
            botao.addEventListener('click', () => {
                const nome = botao.dataset.nome;
                const preco = parseFloat(botao.dataset.preco);

                if (quantidades[nome]) {
                    quantidades[nome] += 1;
                    itens[nome].innerHTML = '<span>' + nome + ' x' + quantidades[nome] + '</span> <span>R$ ' + (preco * quantidades[nome]).toFixed(2) + '</span>';
                } else {
                    const li = document.createElement('li');
                    li.innerHTML = '<span>' + nome + '</span> <span>R$ ' + preco.toFixed(2) + '</span>';
                    listaCarrinho.appendChild(li);

                    li.addEventListener('click', () => {
                        total -= preco * quantidades[nome];
                        valorTotalEl.textContent = total.toFixed(2);
                        li.remove();
                        delete quantidades[nome];
                        delete itens[nome];
                    });

                    quantidades[nome] = 1;
                    itens[nome] = li;
                }

                total += preco;
                valorTotalEl.textContent = total.toFixed(2);
            });
        });

        botaoEsvaziar.addEventListener("click", function () {
            listaCarrinho.innerHTML = '';
            total = 0;
            quantidades = {};
            itens = {};
            valorTotalEl.textContent = total.toFixed(2);
        });
    </script>
</body>

</html>
